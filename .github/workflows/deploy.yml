name: Deploy through Tailscale
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-mashrute
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Connect private deployment network
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-mashrute
          version: 1.98.10
      - name: Build and deploy on the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.TAILSCALE_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.TAILSCALE_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_NAME: mashrute
          DEPLOY_TARGET: 10.77.10.2
          DEPLOY_USER: deploy-mashrute
        run: bash scripts/deploy-tailscale.sh
      - name: Verify public website
        run: curl -4 --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 -o /dev/null https://mashrute.wiki/
